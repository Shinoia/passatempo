    <title>Barzinho · Sistema</title>
    <style>
        /* ===== Visual do Barzinho (escuro, destaque âmbar) ===== */
        :root { --bg:#14110f; --painel:#201a17; --painel2:#2a231f; --linha:#3a312b; --txt:#f4ede5; --sub:#b9ab9c; --ambar:#e9a23b; --verde:#3fb37f; --azul:#4a90d9; --verm:#e05a4f; --laranja:#f08a3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #14110f; color: #f4ede5; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #0d0b0a; border-bottom: 1px solid #3a312b; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; }
        h1 { font-size: 1.25rem; font-weight: 800; color: #e9a23b; letter-spacing: 0.04em; text-transform: uppercase; }
        h2, h3 { color: #f4ede5; }
        small { color: inherit; }
        a { color: #e9a23b; }
        .nav-buttons { display: flex; gap: 0.35rem; background: #201a17; padding: 0.3rem; border-radius: 12px; border: 1px solid #3a312b; align-items: center; flex-wrap: wrap; }
        button { cursor: pointer; border: 1px solid #3a312b; font-weight: 700; font-size: 0.9rem; border-radius: 10px; padding: 0.55rem 1rem; color: #f4ede5; background: #2a231f; font-family: inherit; }
        button:disabled { opacity: 0.45; cursor: default; }
        .nav-buttons { gap: 0.2rem; }
        .nav-buttons button { padding: 0.45rem 0.6rem; font-size: 0.82rem; }
        .btn-tab { background: transparent; color: #b9ab9c; border-color: transparent; }
        .active-caixa, .active-cozinha, .active-bar, .active-abertas, .active-vip, .active-logs, .active-finalizadas { background: #e9a23b !important; color: #1b1206 !important; border-color: #e9a23b !important; }
        .btn-dia { background: #2a231f; border: 1px solid #3a312b; color: #f4ede5; }
        main { flex: 1; padding: 1rem 1.1rem; display: block; }
        .grid-caixa { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
        @media(min-width: 1024px) { .grid-caixa { grid-template-columns: 2fr 1fr; } }
        .mesas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        @media(min-width: 640px) { .mesas-grid { grid-template-columns: repeat(4, 1fr); } }
        .grid-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
        .mesa-card.cartao-aberto { height: auto; padding: 1rem 1.1rem; gap: 0.75rem; cursor: default; line-height: 1.35; }
        .mesa-card { background: #201a17; border: 2px solid #3a312b; border-radius: 14px; padding: 0.9rem; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 8rem; color: #f4ede5; }
        .mesa-card.ocupada { background: #2b2118; border-color: #6b4a22; }
        .mesa-card.ocupada strong { color: #f4ede5; }
        .mesa-card .badge + button, .mesa-card button { border-color: #3a312b; }
        .mesa-card.teste { background: #241d33 !important; border-color: #7c5cc4 !important; }
        .kds-card.teste { border: 3px dashed #7c5cc4 !important; }
        .mesa-card.selecionada { border-color: #e9a23b; box-shadow: 0 0 0 2px #e9a23b inset; }
        .painel-lateral { background: #201a17; border: 1px solid #3a312b; border-radius: 16px; padding: 1.1rem; display: flex; flex-direction: column; color: #f4ede5; }
        .form-grupo { background: #2a231f; padding: 0.75rem; border-radius: 12px; border: 1px solid #3a312b; margin-bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
        select, input, textarea { background: #14110f; border: 1px solid #3a312b; border-radius: 10px; padding: 0.6rem 0.7rem; font-size: 0.95rem; width: 100%; font-weight: 600; color: #f4ede5; font-family: inherit; }
        option { background: #201a17; color: #f4ede5; }
        input[type=checkbox], input[type=radio] { width: auto; accent-color: #e9a23b; }
        input::placeholder { color: #8a7d70; }
        .btn-lancar { background: #e9a23b; font-weight: 800; width: 100%; padding: 0.7rem; border-radius: 10px; border: 0; color: #1b1206; font-size: 1rem; }
        .lista-itens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: 14rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .item-row { background: #2a231f; padding: 0.7rem; border-radius: 10px; border: 1px solid #3a312b; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #f4ede5; }
        .kds-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 0.9rem; }
        @media(min-width: 768px) { .kds-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .kds-grid { grid-template-columns: repeat(3, 1fr); } }

        /* cartões do bar / cozinha (iguais ao Barzinho: fundo escuro, borda colorida pelo status) */
        .kds-card { padding: 0.9rem 1rem; border-radius: 14px; border: 2px solid #8a6a1f; border-left-width: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 11rem; gap: 0.5rem; background: #201a17; color: #f4ede5; font-size: 1.05rem; }
        .kds-card.preparando { border-color: #4a90d9; }
        .kds-card.pronto { border-color: #3fb37f; }
        .kds-card.entregue { border-color: #3a312b; opacity: 0.7; }

        .badge { padding: 0.15rem 0.55rem; border-radius: 20px; font-size: 0.72rem; font-weight: 800; background: #33302d; color: #f4ede5; white-space: nowrap; }
        .btn-acao-entregue { background: #3fb37f; border: 0; border-radius: 10px; padding: 0.45rem 0.7rem; font-size: 0.85rem; font-weight: 800; color: #08210f; text-align: center; }
        .bloqueado header, .bloqueado main { visibility: hidden !important; }
        .sync-status { font-size: 0.8rem; font-weight: 700; background: transparent; padding: 0.25rem 0.5rem; border-radius: 20px; border: 1px solid #3a312b; color: #3fb37f; }
        .sync-status.off { background: #5a1f1a !important; color: #fff !important; border-color: #e05a4f; animation: piscaOff 1s infinite; }
        @keyframes piscaOff { 50% { opacity: 0.55; } }
        #info-usuario { color: #f4ede5 !important; }

        /* texto escuro sobre os fundos claros/coloridos (âmbar, verde e cores de status) */
        [style*="background:#e9a23b"], [style*="background: #e9a23b"] { color: #1b1206 !important; border-color: #e9a23b !important; }
        [style*="background:#3fb37f"], [style*="background: #3fb37f"] { color: #08210f !important; border-color: #3fb37f !important; }
        [style*="background:#ffd27a"], [style*="background:#a9cdf5"], [style*="background:#5fd39b"], [style*="background:#a99e93"] { color: #1b1206 !important; }
        [style*="background:#c9483d"], [style*="background:#5a1f1a"], [style*="background:#e05a4f"] { color: #fff !important; }
        [style*="background:#4a3a14"] { color: #ffd27a !important; }
        [style*="background:#2d2440"], [style*="background:#241d33"] { color: #e6dcff !important; }
        [style*="background:#3d1f1c"] { color: #f6c9c3 !important; }
        [style*="background:#1d3a2a"] { color: #bdebd1 !important; }
        [style*="background:#1f2f45"] { color: #cfe2f8 !important; }

        /* Safari antigo (iPad com iOS 12) não conhece "gap" em flexbox: espaçamento reserva */
        .sem-gap header > *, .sem-gap .nav-buttons > *, .sem-gap [style*="display:flex"] > *, .sem-gap [style*="display: flex"] > * { margin-right: 0.4rem; margin-bottom: 0.3rem; }
        .sem-gap .form-grupo > *, .sem-gap .lista-itens > *, .sem-gap .kds-card > *, .sem-gap [style*="flex-direction:column"] > * { margin-right: 0; margin-bottom: 0.4rem; }
        html { -webkit-text-size-adjust: 100%; }
        body { padding-top: env(safe-area-inset-top); }

        /* modo SUPREME: mesmo visual, com um toque roxo para lembrar que é o usuário de testes */
        body.supreme { background-color: #15111c; }
        body.supreme header { background-color: #120e19; border-bottom-color: #7c5cc4; }
        body.supreme .nav-buttons, body.supreme .painel-lateral { border-color: #4b3a6e; }
        body.supreme h1 { color: #c4a8ff; }

        /* ===== disposição do Barzinho ===== */
        html, body { height: 100%; }
        body { overflow: hidden; }
        header { flex-wrap: nowrap; padding: 0.5rem 0.9rem; min-height: 54px; }
        header > * { margin-right: 0.45rem; }
        header > *:last-child { margin-right: 0; }
        .bz-marca { font-weight: 800; letter-spacing: 0.05em; color: #e9a23b; font-size: 1.15rem; white-space: nowrap; }
        body.supreme .bz-marca { color: #c4a8ff; }
        #bz-tela-nome { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
        .bz-espaco { flex: 1; }
        #bz-abas { flex-wrap: nowrap; padding: 0.2rem; }
        #bz-abas button { white-space: nowrap; padding: 0.42rem 0.6rem; }
        #rotulo-versao { right: auto !important; left: 6px !important; bottom: 2px !important; font-size: 10px !important; opacity: 0.5; background: transparent !important; }
        #sync-indicator { border: 0; padding: 0; white-space: nowrap; }
        #sync-indicator::before { content: '● '; }
        .bz-usuario { font-size: 0.85rem; color: #b9ab9c; white-space: nowrap; }
        #bz-relogio { color: #b9ab9c; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
        .ghost { background: #2a231f; padding: 0.45rem 0.65rem; font-size: 0.82rem; white-space: nowrap; }
        @media (max-width: 1100px) { #bz-relogio { display: none; } #sync-indicator { font-size: 0; } #sync-indicator::before { font-size: 16px; } }
        main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
        main.bz-cheio { overflow: hidden; padding: 0; }
        main.bz-rolavel { overflow-y: auto; padding: 1rem 1.1rem; }

        /* tela inicial */
        .bz-inicio { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .bz-inicio h1 { margin: 0 0 6px; color: #e9a23b; font-size: 1.8rem; text-transform: none; letter-spacing: 0; }
        .bz-inicio p { color: #b9ab9c; margin: 0 0 26px; }
        .bz-inicio .bz-dica { margin: 26px 0 0; font-size: 0.85rem; }
        .bz-telas { display: grid; grid-template-columns: repeat(3, 210px); grid-gap: 18px; }
        .bz-telas button { background: #201a17; border: 2px solid #3a312b; padding: 30px 10px; font-size: 22px; font-weight: 700; }
        .bz-telas button span { display: block; font-size: 46px; margin-bottom: 8px; }
        .bz-telas button small { display: block; font-size: 13px; font-weight: 400; color: #b9ab9c; margin-top: 6px; }
        .bz-comecar { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,8,7,0.92); display: flex; align-items: center; justify-content: center; z-index: 90; }
        .bz-comecar button { background: #e9a23b; color: #1b1206; border: 0; font-size: 24px; font-weight: 800; padding: 26px 40px; border-radius: 16px; }
        .bz-comecar small { display: block; font-size: 14px; font-weight: 500; margin-top: 6px; }

        /* caixa */
        .bz-caixa { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
        .bz-lado { border-right: 1px solid #3a312b; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
        .bz-lado h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #b9ab9c; margin: 18px 0 8px; }
        .bz-botoes { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 8px; margin-bottom: 10px; }
        .bz-botoes button:only-child { grid-column: span 2; }
        .bz-nota { color: #b9ab9c; font-size: 0.8rem; margin: -2px 0 10px; }
        .bz-mesas { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
        .bz-mesa { background: #201a17; border: 2px solid #3a312b; padding: 11px 10px; text-align: left; min-height: 92px; display: block; width: 100%; border-radius: 12px; }
        .bz-mesa.ocupada { background: #2b2118; border-color: #6b4a22; }
        .bz-mesa.sel { border-color: #e9a23b; box-shadow: 0 0 0 2px #e9a23b inset; }
        .bz-mesa.teste { background: #241d33; border-color: #7c5cc4; }
        .bz-mesa-nome { display: block; font-weight: 800; font-size: 1.05rem; overflow-wrap: anywhere; }
        .bz-mesa div, .bz-mesa small { font-size: 0.8rem; font-weight: 500; color: #b9ab9c; }

<body>
    <header>
        <div class="bz-marca"><span id="icone-foice">🍸</span> BARZINHO</div>
        <div id="bz-tela-nome"></div>
        <div class="nav-buttons" id="bz-abas" style="display:none;">
            <button id="btn-aba-caixa" class="btn-tab active-caixa" onclick="mudarAba('caixa')">Comandas</button>
            <button id="btn-aba-vip" class="btn-tab" onclick="mudarAba('vip')">⭐ VIPs</button>
            <button id="btn-aba-finalizadas" class="btn-tab" onclick="mudarAba('finalizadas')">✅ Finalizadas</button>
            <button id="btn-aba-logs" class="btn-tab" style="display:none;" onclick="mudarAba('logs')">🛡️ Logs</button>
        </div>
        <div class="bz-espaco"></div>
        <span id="sync-indicator" class="sync-status">Conectado</span>
        <span id="info-usuario" class="bz-usuario"></span>
        <span id="bz-relogio"></span>
        <button id="bz-btn-trocar" class="ghost" style="display:none;" onclick="bzTrocarTela()">⇄ Trocar tela</button>
        <button class="ghost" onclick="sair()" title="Sair deste aparelho">Sair</button>
    </header>

    <main id="app-conteudo"></main>

    <script>
        (function() {
            try {
                var a = document.createElement('div'); a.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
                a.appendChild(document.createElement('i')); a.appendChild(document.createElement('i'));
                a.firstChild.style.height = a.lastChild.style.height = '1px';
                document.body.appendChild(a);
                var ok = a.offsetHeight === 3;
                document.body.removeChild(a);
                if (!ok) document.documentElement.className += ' sem-gap';
            } catch (e) {}
        })();
        var ESTACAO = /[?&]estacao=1/.test(location.search); // notebook do bar: imprime sozinho o que os iPads enviam
        var API_URL = "https://script.google.com/macros/s/AKfycbwwiLp9tA9pR5Zd1AnZb4OZye60pEWGjy463f7IiW-yEzcpyKAlB_18ShM0IgpZHO5pKg/exec";

        // ---------- login da equipe (usuário + senha da aba "Key" da planilha) ----------
        // Todas as chamadas ao servidor levam usuário e senha; sem eles o servidor não responde.
        // O login fica guardado neste aparelho até o fim do dia de trabalho (06:00) e sobrevive a atualizações da página.
        function diaDeTrabalho() { return new Date(Date.now() - 6 * 3600 * 1000).toDateString(); }
        function lerSessao() {
            try {
                var v = JSON.parse(localStorage.getItem('bzn_sessao2') || 'null');
                return (v && v.dia === diaDeTrabalho() && v.chave && v.usuario) ? v : null;
            } catch (e) { return null; }
        }
        function guardarSessao(usuario, chave) {
            try { if (chave) localStorage.setItem('bzn_sessao2', JSON.stringify({ usuario: usuario, chave: chave, dia: diaDeTrabalho() })); else localStorage.removeItem('bzn_sessao2'); } catch (e) {}
        }
        var SESSAO = lerSessao();
        var CHAVE = SESSAO ? SESSAO.chave : '';
        var USUARIO = SESSAO ? SESSAO.usuario : '';
        var DEV = (function() {
            try {
                var d = localStorage.getItem('bzn_dev');
                if (!d) { d = Math.random().toString(36).substring(2, 6); localStorage.setItem('bzn_dev', d); }
                var ua = navigator.userAgent || '', plat = /iPad/.test(ua) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Aparelho';
                return plat + ' ' + d;
            } catch (e) { return 'Aparelho'; }
        })();
        var fetchOriginal = fetch;
        fetch = function(u, o) {
            if (String(u).indexOf(API_URL) !== 0) return fetchOriginal(u, o);
            if (CHAVE && !lerSessao()) { CHAVE = ''; USUARIO = ''; } // virou o dia de trabalho
            if (!CHAVE) { pedirChave(''); return Promise.reject(new Error('sem login')); }
            if (o && o.method === 'POST') {
                var corpo = {};
                try { corpo = JSON.parse(o.body); } catch (e) {}
                corpo.chave = CHAVE; corpo.usuario = USUARIO; corpo.dev = DEV;
                var o2 = {}; for (var k in o) o2[k] = o[k];
                o2.body = JSON.stringify(corpo);
                return fetchOriginal(u, o2);
            }
            u = String(u) + (String(u).indexOf('?') >= 0 ? '&' : '?') + 'chave=' + encodeURIComponent(CHAVE) + '&usuario=' + encodeURIComponent(USUARIO) + '&dev=' + encodeURIComponent(DEV);
            var tentativas = 0;
            function pedir() {
                return fetchOriginal(u, o).then(function(res) {
                    return res.clone().json().then(function(j) {
                        if (j && j.negado) {
                            CHAVE = ''; USUARIO = ''; guardarSessao('', '');
                            pedirChave(j.off ? 'Seu acesso está desativado (off).' : ((j.bloqueado || j.desbloqueado) ? j.error : 'Usuário ou senha incorretos.'));
                        }
                        // servidor gravando outra coisa: espera um instante e manda de novo (nada se perde)
                        if (j && j.ocupado && tentativas++ < 40) return new Promise(function(ok) { setTimeout(ok, 1000); }).then(pedir);
                        return res;
                    }, function() { return res; });
                });
            }
            return pedir();
        };
        function pedirChave(aviso) {
            if (document.getElementById('janela-chave')) return;
            var el = document.createElement('div');
            el.id = 'janela-chave';
            el.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; background:#0d0b0a; display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem;';
            el.innerHTML = '<div style="background:#2a231f; border:3px solid #3a312b; border-radius:0.75rem; padding:1.25rem; width:100%; max-width:22rem; color:#f4ede5;">' +
                '<h3 style="margin-bottom:0.75rem;">🔒 Barzinho</h3>' +
                (aviso ? '<p style="color:#f0a39c; font-weight:bold; margin-bottom:0.5rem;">' + esc(aviso) + '</p>' : '') +
                '<label style="font-size:0.85rem;">Usuário:</label>' +
                '<input type="text" id="input-usuario" autocomplete="username" style="width:100%; margin:0.25rem 0 0.5rem;">' +
                '<label style="font-size:0.85rem;">Senha:</label>' +
                '<input type="password" id="input-chave" autocomplete="current-password" style="width:100%; margin:0.25rem 0 0.4rem;" onkeydown="if(event.key===\'Enter\') entrarComChave()">' +
                '<label style="display:block; font-size:0.85rem; margin-bottom:0.75rem;"><input type="checkbox" id="chk-ver-senha" style="width:auto; display:inline-block; margin-right:0.4rem;" onchange="document.getElementById(\'input-chave\').type = this.checked ? \'text\' : \'password\'"> Mostrar senha</label>' +
                '<button type="button" onclick="entrarComChave()" style="background:#e9a23b; border:2px solid #3a312b; width:100%;">Entrar</button></div>';
            document.body.appendChild(el);
            document.body.classList.add('bloqueado');
            var inp = document.getElementById('input-usuario');
            if (inp && inp.focus) inp.focus();
        }
        function entrarComChave() {
            var u = String((document.getElementById('input-usuario') || {}).value || '').trim();
            var v = String((document.getElementById('input-chave') || {}).value || '').trim();
            if (!u || !v) return;
            CHAVE = v; USUARIO = u;
            guardarSessao(u, v);
            var el = document.getElementById('janela-chave');
            if (el && el.parentNode) el.parentNode.removeChild(el);
            document.body.classList.remove('bloqueado');
            sincronizar();
        }
        function sair() {
            if (!confirm('Sair do sistema neste aparelho?')) return;
            CHAVE = ''; USUARIO = ''; guardarSessao('', '');
            estado.usuario = null;
            atualizarUsuario();
            pedirChave('');
        }
        function atualizarUsuario() {
            var el = document.getElementById('info-usuario');
            if (!el) return;
            try { document.body.className = document.body.className.replace(/\s*\bsupreme\b/g, '') + (estado.usuario && estado.usuario.supreme ? ' supreme' : ''); } catch (eS) {}
            var bl = document.getElementById('btn-aba-logs');
            if (bl) bl.style.display = (estado.usuario && estado.usuario.supreme) ? '' : 'none';
            if (estado.abaAtiva === 'logs' && !(estado.usuario && estado.usuario.supreme)) { estado.abaAtiva = 'caixa'; try { mudarAba('caixa'); } catch (eL) {} }
            var bd = document.getElementById('btn-dia');
            if (bd) bd.style.display = (estado.usuario && !estado.usuario.admin) ? 'none' : ''; // user não vê Finalizar Dia
            el.textContent = estado.usuario ? ('👤 ' + estado.usuario.nome + (estado.usuario.supreme ? ' (supreme)' : estado.usuario.admin ? ' (admin)' : ' (user)')) : '';
            atualizarRotuloVersao();
        }
        function exigirAdmin() {
            if (estado.usuario && !estado.usuario.admin) { alert('Somente administradores podem fazer isso.'); return false; }
            return true;
        }

        // Cardápio de segurança preenchido para garantir funcionamento imediato
        var CARDAPIO = [
            { nome: "Refrigerante", preco: 6.00, estoque: 50, tipo: "bar" },
            { nome: "Kariri", preco: 10.00, estoque: 30, tipo: "bar" },
            { nome: "Conserva", preco: 15.00, estoque: 20, tipo: "cozinha" }
        ];
        // última lista de produtos recebida da planilha fica guardada neste aparelho: abre instantâneo, sem esperar a planilha
        var CARDAPIO_OK = false;
        try {
            var cacheCard = JSON.parse(localStorage.getItem('bzn_cardapioCache') || 'null');
            if (cacheCard && cacheCard.length) { CARDAPIO = cacheCard; CARDAPIO_OK = true; }
        } catch (eC) {}

        var estado = {
            abaAtiva: 'caixa',
            mesaSelecionadaId: null,
            produtoSelecionadoCache: '',
            quantidadeCache: 1,
            pedidosGlobais: [],
            pendentes: [],
            overrides: {},
            obsCache: '',
            mesas: [],
            pessoas: [],
            pessoasNovas: [],
            finalizadas: [],
            frequentes: [],
            clientes: [],
            telefones: [],
            usuario: null,
            fechamento: null
        };
        var PREFIXO_PESSOA = 'Pessoa: ';

        estado.mesasNovas = []; // números de comanda digitados em "+ Nova comanda" que ainda não receberam pedido

        var CORES_STATUS = { pendente: '#ffd27a', preparando: '#a9cdf5', pronto: '#5fd39b', entregue: '#a99e93' };
        function corStatus(st) { return CORES_STATUS[st] || '#2a231f'; }

        // chave estável de um item aberto: mesa + produto + ordem entre os itens abertos iguais.
        // Não usa o horário: um pedido recém-lançado (ainda sem horário) e o mesmo pedido depois de gravado na planilha têm a mesma chave.
        function chavePedido(lista, idx) {
            var q0 = lista[idx];
            if (q0.status === 'fechado') return 'fechado|' + idx;
            var base = String(q0.mesa) + '|' + q0.produto;
            var n = 0;
            for (var i = 0; i < idx; i++) {
                var q = lista[i];
                if (q.status !== 'fechado' && String(q.mesa) + '|' + q.produto === base) n++;
            }
            return base + '|' + n;
        }

        function esc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function brl(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        // observação do pedido (ex.: sem cebola): texto curto, sem quebra de linha
        function limparObs(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').replace(/^[=+\-@\s]+/, '').trim().substring(0, 60);
        }
        function htmlObs(obs, grande) {
            if (!obs) return '';
            return grande
                ? '<div style="font-size:0.9rem; font-weight:bold; background:#2a231f; border:2px solid #3a312b; border-radius:0.4rem; padding:0.15rem 0.4rem; margin-top:0.25rem;">📝 ' + esc(obs) + '</div>'
                : '<br><small>📝 ' + esc(obs) + '</small>';
        }
        function ehVip(chave) { return String(chave).indexOf('VIP-') === 0; }
        function ehPessoa(chave) { return String(chave).indexOf(PREFIXO_PESSOA) === 0; }
        function limparNome(n) {
            return String(n || '').replace(/[.|<>&"'`=+@\\]/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 30);
        }
        // "Comanda 003 - Fernando - 11999998888" -> {num:'003', nome:'Fernando', tel:'11999998888'}
        function partesPessoa(n) {
            var m = /^Comanda (T?\d+) - (.*)$/.exec(String(n));
            if (!m) return { num: '', nome: String(n), tel: '' };
            var resto = m[2], t = /^(.*) - (\d{8,})$/.exec(resto);
            return t ? { num: m[1], nome: t[1], tel: t[2] } : { num: m[1], nome: resto, tel: '' };
        }
        // campo de telefone (opcional) antes do 1º pedido: 'pessoa' (grava na chave), 'mesa' (grava na aba Telefones) ou ''
        // nome (só mesas): sugere clientes da aba Clientes e, se o cliente tem telefone lá, preenche o campo
        // clientes com o MESMO nome completo (ex.: 4 "Fernando"): a lista mostra o final do telefone para diferenciar
        function sufixoTel(c) { return ''; } // (não mostramos mais o final do telefone: o bar não decora os números)
        // nome sem sobrenome que já existe na lista: sugere sobrenome ou apelido para não confundir clientes
        function avisoNomeRepetido(txt) {
            var t = limparNome(txt), q = semAcento(t);
            if (!q || q.indexOf(' ') >= 0) return '';
            var existe = estado.clientes.some(function(c) { return semAcento(c.nome) === q; });
            return existe ? '<div style="background:#4a3a14; border:2px solid #b45309; border-radius:0.5rem; padding:0.4rem 0.5rem; margin-top:0.4rem; font-size:0.8rem; color:#f4ede5;">⚠️ Já existe um cliente chamado <b>' + esc(t) + '</b>. Se for outra pessoa, acrescente o <b>sobrenome ou apelido</b> (ex.: ' + esc(t) + ' Silva, ' + esc(t) + ' Barba).</div>' : '';
        }
        function achaCliente(nome) {
            var q = semAcento(limparNome(nome));
            if (!q) return null;
            return estado.clientes.find(function(c) { return semAcento(c.nome) === q; }) || null;
        }
        function preencherTelDoCliente(c) {
            var t = document.getElementById('input-tel-pessoa'), ni = document.getElementById('tel-ni');
            if (!c || !c.tel || !t) return;
            estado.telNI = false; if (ni) ni.checked = false;
            t.disabled = false; t.value = c.tel; estado.telCache = c.tel;
        }
        function sugerirNomeMesa(txt) {
            estado.nomeMesaCache = txt;
            var box = document.getElementById('sug-mesa');
            if (!box) return;
            var lista = limparNome(txt) ? filtrarClientes(txt) : [];
            box.innerHTML = lista.length ? '<div style="border:2px solid #3a312b; border-radius:0.5rem; overflow:hidden; margin-top:0.25rem;">' + lista.map(function(c) {
                return '<button type="button" data-nome="' + esc(c.nome) + '" data-tel="' + esc(c.tel || '') + '" onclick="escolherNomeMesa(this.getAttribute(\'data-nome\'), this.getAttribute(\'data-tel\'))" style="display:block; width:100%; text-align:left; background:#2a231f; border:0; border-bottom:1px solid #ccc; padding:0.5rem; color:#f4ede5;">' + esc(c.nome) + (c.tel ? sufixoTel(c) + ' 📞' : '') + '</button>';
            }).join('') + '</div>' : '';
            box.innerHTML += avisoNomeRepetido(txt);
            var ex = achaCliente(txt);
            if (ex && ex.tel && !String(estado.telCache || '').trim()) preencherTelDoCliente(ex);
        }
        function escolherNomeMesa(nome, tel) {
            var inp = document.getElementById('input-nome-mesa');
            if (inp) inp.value = nome;
            estado.nomeMesaCache = nome;
            var box = document.getElementById('sug-mesa'); if (box) box.innerHTML = '';
            if (tel) preencherTelDoCliente({ tel: tel }); else preencherTelDoCliente(achaCliente(nome));
        }
        function telNaoInformado(on) {
            estado.telNI = !!on;
            var t = document.getElementById('input-tel-pessoa');
            if (t) { if (on) { t.value = ''; estado.telCache = ''; } t.disabled = !!on; }
        }
        function tipoCampoTelefone(m) {
            if (!m || m.vip || (m.itens && m.itens.length)) return '';
            if (m.pessoa) { var pp = partesPessoa(m.nome); return (pp.num && !pp.tel) ? 'pessoa' : ''; }
            return 'mesa';
        }
        function todasMesas() { return estado.mesas.concat(estado.pessoas); }
        function acharMesa(id) { return todasMesas().find(function(m) { return String(m.id) === String(id); }); }
        // nome para mostrar na tela
        function nomeMesa(m) {
            if (m.pessoa) {
                var pp = partesPessoa(m.nome);
                if (!m.vip && pp.num) return '👤 ' + pp.nome + ' · Comanda ' + pp.num;
                return (m.vip ? '⭐ ' : '👤 ') + m.nome;
            }
            var r = padKey(m.idExibicao || m.id);
            if (m.status === 'livre' && m.contadorFehamentos > 0) r = padKey(m.id) + '.' + m.contadorFehamentos;
            return 'Comanda ' + r;
        }
        // identificador gravado na coluna A da planilha para novos pedidos
        function chaveMesa(m) {
            if (m.pessoa) return m.id;
            if (m.status === 'livre' && m.contadorFehamentos > 0) return padKey(m.id) + '.' + m.contadorFehamentos;
            if (m.status === 'ocupada' && m.idExibicao) return m.idExibicao;
            return padKey(m.id);
        }
        function totalMesaObj(m) {
            var t = 0;
            for (var i = 0; i < m.itens.length; i++) t += m.itens[i].qnt * m.itens[i].preco;
            return t;
        }

        // ---- modo TESTE (login Queen): pedidos marcados com [TESTE] na observação, mostrados em roxo com a etiqueta TESTE ----
        function souTeste() { return !!(estado.usuario && estado.usuario.supreme); } // papel supreme (coluna C da aba Key)
        // Comanda 013 com o nome Santos é a comanda de teste liberada para QUALQUER usuário (nunca entra no caixa nem mexe no estoque)
        function ehMesaTesteFixa(m) { return /Comanda\s*0*13\s*-\s*Santos/i.test(String(m || '')); }
        function etiquetaTeste() { return '<b style="background:#7c5cc4; color:#fff; border-radius:0.3rem; padding:0 0.4rem; font-size:0.75rem; letter-spacing:0.05em;">TESTE</b>'; }
        function mesaTeste(m) { return !!(m && m.itens && m.itens.some(function(it) { return it.teste; })); }
        // cores da lista de produtos: caixa = verde suave, bar = azul suave, cozinha = vermelho suave (+ coração no texto, p/ iPad que ignora a cor)
        function estiloTipo(tipo) {
            var t = String(tipo || 'bar').toLowerCase();
            if (t.indexOf('caixa') >= 0) return { bg: '#1d3a2a', ico: '💚 ' };
            if (t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0) return { bg: '#3d1f1c', ico: '❤️ ' };
            return { bg: '#1f2f45', ico: '💙 ' };
        }
        function itemEhCaixa(it) { return String(it.tipo || '').toLowerCase().indexOf('caixa') >= 0; }
        function itemEhCozinha(it) {
            var t = String(it.tipo || 'bar').toLowerCase();
            return t.indexOf('cozinha') >= 0 || t.indexOf('petisco') >= 0 || t.indexOf('comida') >= 0;
        }
        // cor do grupo (bar ou cozinha) da mesa: pronto > preparando > pendente > entregue; branco = sem itens
        function corGrupo(itens, cozinha) {
            var sts = itens.filter(function(it) { return !itemEhCaixa(it) && itemEhCozinha(it) === cozinha; })
                           .map(function(it) { return it.statusPreparo || 'pendente'; });
            if (sts.length === 0) return '#2a231f';
            return corStatus(sts.indexOf('pronto') >= 0 ? 'pronto' : sts.indexOf('preparando') >= 0 ? 'preparando' : sts.indexOf('pendente') >= 0 ? 'pendente' : 'entregue');
        }
        function bolinha(rotulo, cor) {
            return '<span style="background:' + cor + '; border: 2px solid #3a312b; border-radius: 999px; padding: 0 0.4rem; font-size: 0.65rem; font-weight: bold; color:#f4ede5; display: inline-block; line-height: 1.1rem; margin-left: 0.25rem;">' + rotulo + '</span>';
        }

        // estoque disponível = estoque da planilha - pedidos enviados que o servidor ainda não gravou
        function estoqueDisponivel(nome) {
            var p = CARDAPIO.find(function(x) { return x.nome === nome; });
            if (!p) return 0;
            var reservado = 0;
            estado.pendentes.forEach(function(pd) {
                if (pd.pedido.produto === nome && !pd.pedido.teste) reservado += Number(pd.pedido.qnt) || 0; // teste não reserva estoque
            });
            return (Number(p.estoque) || 0) - reservado;
        }
        function primeiroDisponivel() {
            for (var c = 0; c < CARDAPIO.length; c++) {
                if (estoqueDisponivel(CARDAPIO[c].nome) > 0) return CARDAPIO[c].nome;
            }
            return '';
        }
        function desfazerPedido(novo, mensagem) {
            estado.pendentes = estado.pendentes.filter(function(pd) { return pd.pedido !== novo; });
            estado.pedidosGlobais = estado.pedidosGlobais.filter(function(x) { return x !== novo; });
            processarPedidos();
            renderizar();
            alert(mensagem);
            sincronizar();
        }

        function processarPedidos() {
            try {
                // comandas (mesas) existem só enquanto abertas: as que têm pedidos + as recém-criadas
                var idsMesa = {};
                estado.mesasNovas.forEach(function(n) { idsMesa[String(n)] = true; });
                for (var q = 0; q < estado.pedidosGlobais.length; q++) {
                    var pq = estado.pedidosGlobais[q];
                    if (!pq || !pq.mesa || ehPessoa(pq.mesa) || ehVip(pq.mesa)) continue;
                    var bq = String(pq.mesa).split('.')[0];
                    if (/^\d+$/.test(bq)) idsMesa[String(parseInt(bq, 10))] = true;
                }
                var antigas = estado.mesas;
                estado.mesas = Object.keys(idsMesa).map(function(id) {
                    var ex = antigas.find(function(m) { return String(m.id) === id; });
                    return ex || { id: parseInt(id, 10), status: 'livre', itens: [], contadorFehamentos: 0 };
                }).sort(function(a, b) { return a.id - b.id; });
                for (var i = 0; i < estado.mesas.length; i++) {
                    estado.mesas[i].itens = [];
                    estado.mesas[i].status = 'livre';
                    estado.mesas[i].contadorFehamentos = 0;
                    estado.mesas[i].idExibicao = null;
                    estado.mesas[i].abertaEm = '';
                }

                var contagemFechamentos = {};
                var fechSets = {};
                var pessoasMapa = {};
                var finMapa = {}, finLista = [];

                for (var k = 0; k < estado.pedidosGlobais.length; k++) {
                    var p = estado.pedidosGlobais[k];
                    if (!p || !p.mesa) continue;
                    if (typeof p.obs === 'string' && p.obs.indexOf('[TESTE]') === 0) { p.teste = true; p.obs = p.obs.replace(/^\[TESTE\]\s*/, ''); }
                    if (p.status === 'fechado') {
                        var kf = String(p.mesa) + '|' + String(p.tchau);
                        if (!finMapa[kf]) { finMapa[kf] = { k: kf, mesa: String(p.mesa), tchau: String(p.tchau), abertura: p.oi || '', itens: [], total: 0, forma: p.forma || '' }; finLista.push(finMapa[kf]); }
                        if (p.teste) finMapa[kf].teste = true;
                        var pcf = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        var prf = p.preco || (pcf ? pcf.preco : 0);
                        finMapa[kf].itens.push({ produto: p.produto, qnt: Number(p.qnt || 1), preco: prf, obs: p.obs || '', pedidoEm: p.pedidoEm || p.oi || '' });
                        finMapa[kf].total += Number(p.qnt || 1) * prf;
                    }
                    var baseId = String(p.mesa).split('.')[0];
                    var mesaObj = estado.mesas.find(function(m) { return m.id == baseId; });
                    if (ehPessoa(p.mesa) || ehVip(p.mesa)) {
                        if (p.status === 'fechado') continue;
                        if (!pessoasMapa[p.mesa]) {
                            pessoasMapa[p.mesa] = { id: p.mesa, pessoa: true, vip: ehVip(p.mesa), nome: ehVip(p.mesa) ? String(p.mesa) : String(p.mesa).substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: p.mesa, contadorFehamentos: 0, abertaEm: p.oi || '' };
                        }
                        mesaObj = pessoasMapa[p.mesa];
                        var pc = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                        mesaObj.itens.push({ idItem: k, produto: p.produto, qnt: Number(p.qnt || 1), preco: pc ? pc.preco : (p.preco || 0), tipo: p.tipo || 'bar', statusPreparo: p.statusPreparo || 'pendente', linha: p.linha, mesaKey: p.mesa, obs: p.obs || '', teste: !!p.teste });
                        continue;
                    }

                    if (mesaObj) {
                        if (p.status === 'fechado') {
                            fechSets[baseId] = fechSets[baseId] || {};
                            if (!p.teste) { // fechamento de teste não muda o número da mesa
                                fechSets[baseId][String(p.tchau)] = true;
                                contagemFechamentos[baseId] = Object.keys(fechSets[baseId]).length;
                            }
                            mesaObj.status = 'livre';
                        } else {
                            mesaObj.status = 'ocupada';
                            mesaObj.idExibicao = p.mesa;
                            if (!mesaObj.abertaEm) mesaObj.abertaEm = p.oi || '';
                            
                            var prodCard = CARDAPIO.find(function(c) { return c.nome && c.nome.toLowerCase() === String(p.produto).toLowerCase(); });
                            var precoUnit = prodCard ? prodCard.preco : (p.preco || 6.00);

                            mesaObj.itens.push({
                                idItem: k,
                                produto: p.produto,
                                qnt: Number(p.qnt || 1),
                                preco: precoUnit,
                                tipo: p.tipo || 'bar',
                                statusPreparo: p.statusPreparo || 'pendente',
                                linha: p.linha,
                                mesaKey: p.mesa,
                                obs: p.obs || '',
                                teste: !!p.teste
                            });
                        }
                    }
                }

                // pessoas: as que têm pedidos em aberto + as cadastradas que ainda não pediram
                estado.pessoas = [];
                for (var chv2 in pessoasMapa) estado.pessoas.push(pessoasMapa[chv2]);
                estado.pessoasNovas.forEach(function(chave) {
                    if (!pessoasMapa[chave]) {
                        estado.pessoas.push({ id: chave, pessoa: true, vip: ehVip(chave), nome: ehVip(chave) ? chave : chave.substring(PREFIXO_PESSOA.length), status: 'ocupada', itens: [], idExibicao: chave, contadorFehamentos: 0, abertaEm: '' });
                    }
                });
                estado.pessoas.sort(function(a, b) { return a.nome.localeCompare(b.nome, 'pt'); });
                finLista.sort(function(a, b) { return ordemData(b.tchau).localeCompare(ordemData(a.tchau)); });
                // comandas que acabei de fechar aparecem na hora em Finalizadas, até a planilha confirmar (aí vale a versão dela)
                if (estado.finPend && estado.finPend.length) {
                    estado.finPend = estado.finPend.filter(function(fp) {
                        if (Date.now() - fp.t > 120000) return false;
                        var nSrv = finLista.filter(function(e) { return e.mesa === fp.mesa; }).length;
                        return nSrv <= fp.antes;
                    });
                    estado.finPend.forEach(function(fp) { finLista.unshift(fp); });
                }
                estado.finalizadas = finLista;

                for (var mId in contagemFechamentos) {
                    var mObj = estado.mesas.find(function(m) { return m.id == mId; });
                    if (mObj && mObj.status === 'livre') {
                        mObj.contadorFehamentos = contagemFechamentos[mId];
                    }
                }
                // comanda recém-criada que já recebeu pedido deixa de ser "nova"; as fechadas e vazias somem da tela
                estado.mesasNovas = estado.mesasNovas.filter(function(n) {
                    var mm = estado.mesas.find(function(m) { return String(m.id) === String(n); });
                    return mm && mm.status !== 'ocupada';
                });
                estado.mesasVisiveis = estado.mesas.filter(function(m) {
                    return m.status === 'ocupada' || estado.mesasNovas.some(function(n) { return String(n) === String(m.id); });
                });
            } catch (err) {
                console.log("Erro ao processar pedidos:", err);
            }
        }

        function capturarValoresFormulario() {
            try {
                var sel = document.getElementById('select-produto');
                var qtd = document.getElementById('input-qtd');
                if (sel) estado.produtoSelecionadoCache = sel.value; // inclui "em branco"
                if (qtd && qtd.value) estado.quantidadeCache = qtd.value;
                var obsEl = document.getElementById('input-obs');
                if (obsEl) estado.obsCache = obsEl.value;
                var telEl = document.getElementById('input-tel-pessoa');
                if (telEl) estado.telCache = telEl.value;
                var nmEl = document.getElementById('input-nome-mesa');
                if (nmEl) estado.nomeMesaCache = nmEl.value;
            } catch (err) {}
        }

        function marcarConexao(ok) {
            var el = document.getElementById('sync-indicator');
            if (!el) return;
            el.textContent = ok ? 'Conectado' : 'Desconectado';
            if (ok) el.classList.remove('off'); else el.classList.add('off');
        }
        // A atualização automática (a cada 5 s) não redesenha a tela enquanto alguém está escolhendo produto,
        // digitando quantidade ou observação: redesenhar fecharia a lista aberta e tiraria o cursor do campo.
        function formEmUso() {
            var ae = document.activeElement;
            return !!(ae && (ae.id === 'select-produto' || ae.id === 'busca-produto' || ae.id === 'input-qtd' || ae.id === 'input-obs' || ae.id === 'input-tel-pessoa' || ae.id === 'tel-ni' || ae.id === 'input-nome-mesa' || String(ae.className || '').indexOf('rap-campo') >= 0));
        }
        function renderizarSeLivre() {
            if (formEmUso()) { estado.renderAdiado = Date.now(); estado.renderPend = true; return; }
            estado.renderPend = false;
            renderizar();
        }
        function sincronizar() {
            if (ESTACAO) return;
            capturarValoresFormulario();
            var meuSeq = (estado.seqReq = (estado.seqReq || 0) + 1);
            estado.sincT = Date.now();
            fetch(API_URL)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    estado.sincT = 0;
                    // resposta mais antiga que outra já aplicada (chegou fora de ordem): descarta, senão o status "volta"
                    if (meuSeq < (estado.seqAplicada || 0)) return;
                    estado.seqAplicada = meuSeq;
                    marcarConexao(!!data);
                    if (data) {
                        if (data.produtos && data.produtos.length > 0) {
                            var antesCard = JSON.stringify(CARDAPIO);
                            CARDAPIO = data.produtos;
                            CARDAPIO_OK = true;
                            try { localStorage.setItem('bzn_cardapioCache', JSON.stringify(CARDAPIO)); } catch (eC2) {}
                            // janela de venda rápida aberta: atualiza a lista de produtos assim que chegar
                            if (estado.vr && !estado.vr.enviando && antesCard !== JSON.stringify(CARDAPIO)) { vrForm(); vrDesenhar(); }
                        }
                        if (data.frequentes) estado.frequentes = data.frequentes;
                        if (data.clientes) estado.clientes = data.clientes;
                        if (data.telefones) estado.telefones = data.telefones;
                        if (data.usuario) { estado.usuario = data.usuario; estado.versao = data.versao || 'antiga'; atualizarUsuario(); }
                        if (data.pedidos) {
                            limparFechando(data.pedidos);
                            estado.pedidosGlobais = data.pedidos;
                            // pedidos enviados que o servidor ainda não gravou continuam na tela
                            estado.pendentes = estado.pendentes.filter(function(pd) {

        function enviarParaFila(html, titulo) {
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ acao: 'fila_add', titulo: titulo || '', html: html }) })
                .then(function() { avisoRapido('🖨️ Enviado para a impressora do bar'); })

        }
        function mudarDestino(v) { gravarConfig('destino', v); }
        function imprimirLocal(html) {
            // segurança: o recibo é impresso num iframe SEM scripts (sandbox) e o HTML é limpo antes; assim um pedido de impressão malicioso não roda código nem lê a senha salva
            html = String(html || '').replace(/<\s*script[\s\S]*?(<\s*\/\s*script\s*>|$)/gi, '')
                .replace(/<\s*\/?\s*(iframe|object|embed|link|meta|base|form|applet|frame|frameset|svg|math|input|button|textarea|select)\b[^>]*>/gi, '')
                .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '').replace(/(javascript|vbscript|data)\s*:/gi, 'bloqueado:');
            var f = document.createElement('iframe');
            f.setAttribute('sandbox', 'allow-same-origin allow-modals');
            f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
            document.body.appendChild(f);
            var d = f.contentWindow.document;
            d.open(); d.write(html); d.close();
            setTimeout(function() {
                try { f.contentWindow.focus(); f.contentWindow.print(); }
                catch (e) { alert('Não foi possível abrir a impressão neste navegador.'); }
                setTimeout(function() { if (f.parentNode) f.parentNode.removeChild(f); }, 8000);
            }, 300);
        }

                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success' && r.pdf) {
                        var alvo = r.pdf;
                        try {
                            if (r.pdfBase64 && window.Blob && window.URL && URL.createObjectURL) {
                                var bin = atob(r.pdfBase64), arr = new Uint8Array(bin.length);
                                for (var bi = 0; bi < bin.length; bi++) arr[bi] = bin.charCodeAt(bi);
                                alvo = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));

        // ---------- estação de impressão (abrir com ?estacao=1 no notebook que tem a impressora) ----------
        function iniciarEstacao() {
            var impressas = 0, ocupado = false, fila = [], rodando = false;
            document.querySelector('main').innerHTML = '<div style="text-align:center; color:#fff; padding:2rem;"><h1>🖨️ Estação de impressão</h1>' +
                '<p style="font-size:1.1rem;">Deixe esta tela aberta. Os pedidos de impressão dos iPads saem aqui sozinhos.</p>' +
                '<div id="est-status" style="font-size:1.5rem; font-weight:bold; margin:1.5rem 0;">Aguardando...</div>' +
                '<div id="est-ultima" style="font-size:0.95rem;"></div></div>';
            function z(n) { return (n < 10 ? '0' : '') + n; }
            function marcar(txt, ok) {
                var el = document.getElementById('est-status');
                if (el) { el.textContent = txt; el.style.color = ok ? '#bbf7d0' : '#fecaca'; }
            }
            function proximo() {
                if (rodando || !fila.length) return;
                rodando = true;
                var j = fila.shift();
                imprimirLocal(j.html);
                impressas++;
                var d = new Date();
                var u = document.getElementById('est-ultima');
                if (u) u.textContent = 'Última impressão: ' + (j.titulo || 'comanda') + ' às ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ' (total hoje: ' + impressas + ')';
                setTimeout(function() { rodando = false; proximo(); }, 2500);
            }
            function buscar() {
                if (ocupado) return;
                ocupado = true;
                fetch(API_URL + '?acao=fila_pegar')
                    .then(function(res) { return res.json(); })
                    .then(function(r) {
                        ocupado = false;
                        if (r && r.result === 'success') {
                            marcar('✅ Conectado — aguardando pedidos', true);
                            (r.jobs || []).forEach(function(j) { fila.push(j); });
                            proximo();
                        } else { marcar('⚠️ Erro: ' + ((r && r.error) || 'resposta inválida'), false); }
                    })
                    .catch(function() { ocupado = false; marcar('⚠️ Sem conexão ou sem login', false); });
            }
            buscar();
            setInterval(buscar, 3000);
        }


        // =====================================================================
        // TELAS NO FORMATO DO BARZINHO
        // (as funções do sistema — pedidos, status, fechar conta, VIP, venda rápida,
        //  impressão, finalizar dia — são as mesmas; aqui muda só a disposição das telas)
        // =====================================================================
        var BZ = { tela: null, vistos: {}, primeira: true, recem: {}, carrinho: [], filtro: 'todos', busca: '', som: null, iniciado: false };
        var BZ_TELAS = { caixa: 'Caixa', bar: 'Bar', cozinha: 'Cozinha' };
        (function() {
            var m = /[?&]tela=(caixa|bar|cozinha)/.exec(location.search);
            var t = m ? m[1] : lerConfig('tela', '');
            BZ.tela = BZ_TELAS[t] ? t : null;
            if (BZ.tela) estado.abaAtiva = BZ.tela;
        })();

        function bzSetor(it) { return itemEhCaixa(it) ? 'caixa' : (itemEhCozinha(it) ? 'cozinha' : 'bar'); }
        function bzPedidoEm(it) { var p = estado.pedidosGlobais[it.idItem]; return (p && (p.pedidoEm || p.oi)) || ''; }
        function bzMs(t) {
            var m = /(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})(?::(\d{2}))?/.exec(String(t || ''));
            return m ? new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +(m[6] || 0)).getTime() : 0;
        }
        function bzMin(t) { var ms = bzMs(t); return ms ? Math.max(0, Math.floor((Date.now() - ms) / 60000)) : 0; }
        function bzIcone(s) { return s === 'cozinha' ? '🍳 Cozinha' : (s === 'caixa' ? '💳 Caixa' : '🍸 Bar'); }
        function bzStatusTxt(it) {
            var st = it.statusPreparo || 'pendente';
            if (bzSetor(it) === 'caixa') return st === 'entregue' ? 'Entregue' : 'Liberar';
            return { pendente: 'Enviado', preparando: 'Em preparo', pronto: 'Pronto', entregue: 'Entregue' }[st] || st;
        }

            var st = it.statusPreparo || 'pendente';

        function bzComandas(vip) {

        // ---------- som (o iPad só libera depois de um toque) ----------
        function bzLiberarSom() {
            try {
                var C = window.AudioContext || window.webkitAudioContext;
                if (!C) return;
                if (!BZ.som) BZ.som = new C();
                if (BZ.som.state === 'suspended' && BZ.som.resume) BZ.som.resume();
                var b = BZ.som.createBuffer(1, 1, 22050), s = BZ.som.createBufferSource();
                s.buffer = b; s.connect(BZ.som.destination); s.start(0);
            } catch (e) {}
        }
        function bzBip(vezes, freq) {
            if (!BZ.som) return;
            try {
                for (var i = 0; i < vezes; i++) {
                    var o = BZ.som.createOscillator(), g = BZ.som.createGain(), t = BZ.som.currentTime + i * 0.28;
                    o.type = 'sine'; o.frequency.value = freq || 880;
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
                    o.connect(g); g.connect(BZ.som.destination);
                    o.start(t); o.stop(t + 0.26);
                }
            } catch (e) {}
        }
        function bzComecar() {
            bzLiberarSom(); BZ.iniciado = true;
            var c = document.getElementById('bz-comecar'); if (c && c.parentNode) c.parentNode.removeChild(c);
        }
        function bzAvisos() {

        function bzFecharPedido() { var el = document.getElementById('bz-pedido'); if (el && el.parentNode) el.parentNode.removeChild(el); }
        function bzDesenharFiltros() {
            var f = document.getElementById('bz-filtros'); if (!f) return;

            }).join('');
        }
        function bzNoCarrinho(nome) { return BZ.carrinho.reduce(function(t, c) { return t + (c.nome === nome ? c.qnt : 0); }, 0); }
        function bzSemAcento(s) { s = String(s || '').toLowerCase(); return s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s; }
        function bzDesenharProdutos() {
            var box = document.getElementById('bz-prods'); if (!box) return;
            if (!CARDAPIO_OK) { box.innerHTML = '<div class="bz-nada">⏳ Carregando produtos da planilha…</div>'; return; }
            var b = bzSemAcento(BZ.busca.trim());
            var lista = CARDAPIO.filter(function(p) {
                var s = bzSetor(p);
                return (BZ.filtro === 'todos' || s === BZ.filtro) && (!b || bzSemAcento(p.nome).indexOf(b) >= 0);
            });
            box.innerHTML = lista.length ? lista.map(function(p, k) {
                var n = bzNoCarrinho(p.nome), resta = estoqueDisponivel(p.nome) - n, s = bzSetor(p);
                var est = resta <= 0 ? '<span class="est baixo">Esgotado</span>' : '<span class="est' + (resta <= 5 ? ' baixo' : '') + '">' + resta + ' em estoque</span>';
                return '<button type="button" class="bz-prod' + (n ? ' qtd' : '') + '" data-nome="' + esc(p.nome) + '" onclick="bzAdicionar(this.getAttribute(\'data-nome\'), 1)"' + (resta <= 0 ? ' disabled' : '') + '>' +
                    '<span class="tag">' + (s === 'cozinha' ? '🍳' : s === 'caixa' ? '💳' : '🍸') + '</span><b>' + esc(p.nome) + '</b>' +
                    '<span class="pr">' + brl(p.preco) + '</span>' + est + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
            }).join('') : '<div class="bz-nada">Nenhum produto encontrado.</div>';
        }
        function bzAdicionar(nome, delta, idx) {
            var p = CARDAPIO.find(function(x) { return x.nome === nome; });
            if (!p) return;
            if (idx == null) { for (var i = BZ.carrinho.length - 1; i >= 0; i--) if (BZ.carrinho[i].nome === nome && !BZ.carrinho[i].obs) { idx = i; break; } }
            if (delta > 0 && bzNoCarrinho(nome) >= estoqueDisponivel(nome)) { avisoRapido('Estoque de ' + nome + ' acabou', true); return; }
            if (idx == null) BZ.carrinho.push({ nome: nome, qnt: 1, obs: '', preco: p.preco, setor: bzSetor(p) });
            else { BZ.carrinho[idx].qnt += delta; if (BZ.carrinho[idx].qnt <= 0) BZ.carrinho.splice(idx, 1); }
            bzDesenharProdutos(); bzDesenharCarrinho();
        }
        function bzDesenharCarrinho() {
            var c = document.getElementById('bz-carrinho'); if (!c) return;
            c.innerHTML = BZ.carrinho.length ? BZ.carrinho.map(function(it, i) {

                    '<button type="button" class="bz-qbtn" onclick="bzAdicionar(BZ.carrinho[' + i + '].nome, -1, ' + i + ')">−</button><span class="qv">' + it.qnt + '</span>' +
                    '<button type="button" class="bz-qbtn" onclick="bzAdicionar(BZ.carrinho[' + i + '].nome, 1, ' + i + ')">+</button></div>' +
                    '<input maxlength="60" placeholder="Observação (ex.: sem cebola, sem gelo)" value="' + esc(it.obs) + '" oninput="if (BZ.carrinho[' + i + ']) BZ.carrinho[' + i + '].obs = this.value"></div>';
            }).join('') : '<div class="bz-nada" style="padding:1.2rem 0.3rem;">Toque nos produtos para adicionar.</div>';

            var b = document.getElementById('bz-enviar'); if (b) b.disabled = !BZ.carrinho.length;
        }
        // cada item do carrinho é lançado pelo mesmo caminho de antes (adicionarItem), com produto, quantidade e observação
        function bzEnviarPedido() {
            if (!BZ.carrinho.length) return;
            var nb = 0, nc = 0, nx = 0, parou = false;
            BZ.lote = [];   // os itens são montados um a um (mesmas conferências de antes) e enviados juntos no fim
            try {
                while (BZ.carrinho.length) {
                    var it = BZ.carrinho[0], antes = estado.pendentes.length;
                    estado.produtoSelecionadoCache = it.nome;
                    estado.quantidadeCache = it.qnt;
                    estado.obsCache = it.obs || '';
                    adicionarItem();
                    if (estado.pendentes.length === antes) { parou = true; break; } // deu erro (ex.: estoque): o resto fica no carrinho
                    if (it.setor === 'cozinha') nc += it.qnt; else if (it.setor === 'caixa') nx += it.qnt; else nb += it.qnt;
                    BZ.carrinho.shift();
                }
            } finally {
                var lote = BZ.lote; BZ.lote = null;
                if (lote && lote.length) bzEnviarLote(lote);
            }
            if (parou) { bzDesenharProdutos(); bzDesenharCarrinho(); return; }
            bzFecharPedido();
            avisoRapido('Pedido enviado' + (nb ? ' · ' + nb + ' p/ bar' : '') + (nc ? ' · ' + nc + ' p/ cozinha' : '') + (nx ? ' · ' + nx + ' do caixa' : ''));
        }

        // ---------- gravação segura: código único por envio, repete até a planilha confirmar ----------
        function bzUid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
        function bzConfirmar(novos) {
            novos.forEach(function(n) {
                n.enviando = false;
                estado.pendentes.forEach(function(pd) { if (pd.pedido === n) pd.ok = Date.now(); });
            });

        }
        function bzDesfazerVarios(novos, msg) {
            estado.pendentes = estado.pendentes.filter(function(pd) { return novos.indexOf(pd.pedido) < 0; });
            estado.pedidosGlobais = estado.pedidosGlobais.filter(function(x) { return novos.indexOf(x) < 0; });
            processarPedidos(); renderizar();
            alert(msg + (novos.length > 1 ? '\n\nNenhum item deste pedido foi lançado.' : ''));
            sincronizar();
        }
        function bzGravar(url, novos, aoOk, aoAntigo, tent) {
            tent = tent || 0;
            function repetir() { setTimeout(function() { bzGravar(url, novos, aoOk, aoAntigo, tent + 1); }, Math.min(8000, 1000 + tent * 1000)); }
            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(r) {
                    if (r && r.result === 'success') { if (aoOk) aoOk(r); bzConfirmar(novos); setTimeout(sincronizar, 150); }
                    else if (r && r.ocupado) repetir();
                    else if (r && r.error) bzDesfazerVarios(novos, r.error);
                    else if (aoAntigo) aoAntigo(r);
                    else repetir();
                })
                .catch(function() { marcarConexao(false); repetir(); });   // sem internet: continua na tela e tenta de novo
        }
        function bzUrlUm(n, tel, nome) {
            return API_URL + '?acao=novo_pedido&uid=' + bzUid() + '&mesa=' + encodeURIComponent(n.mesa) +
                '&produto=' + encodeURIComponent(n.produto) + '&qnt=' + encodeURIComponent(n.qnt) +
                (n.teste ? '&teste=1' : '') + (tel ? '&tel=' + encodeURIComponent(tel) : '') + (nome ? '&nome=' + encodeURIComponent(nome) : '') +
                (n.obs ? '&obs=' + encodeURIComponent(n.obs) : '');
        }
        function bzEnviarLote(lote) {
            var grupos = {}, ordem = [];
            lote.forEach(function(x) { var k = String(x.novo.mesa); if (!grupos[k]) { grupos[k] = []; ordem.push(k); } grupos[k].push(x); });
            ordem.forEach(function(mesa) {
                var g = grupos[mesa], tel = '', nome = '', teste = false;
                g.forEach(function(x) { if (x.tel && !tel) tel = x.tel; if (x.nome && !nome) nome = x.nome; if (x.novo.teste) teste = true; });
                var novos = g.map(function(x) { return x.novo; });
                var itens = novos.map(function(n) { return { produto: n.produto, qnt: n.qnt, obs: n.obs || '' }; });
                var url = API_URL + '?acao=novo_lote&uid=' + bzUid() + '&mesa=' + encodeURIComponent(mesa) + '&itens=' + encodeURIComponent(JSON.stringify(itens)) +
                    (teste ? '&teste=1' : '') + (tel ? '&tel=' + encodeURIComponent(tel) : '') + (nome ? '&nome=' + encodeURIComponent(nome) : '');
                bzGravar(url, novos, function(r) {
                    (r.linhas || []).forEach(function(l, i) { if (novos[i]) novos[i].linha = l; });
                }, function() {
                    // Apps Script ainda sem "novo_lote": manda um item por vez, em fila (um só depois do outro)
                    var i = 0;
                    (function proximo() {
                        if (i >= novos.length) return;
                        var n = novos[i];
                        bzGravar(bzUrlUm(n, i === 0 ? tel : '', i === 0 ? nome : ''), [n], function(r) { if (r.linha) n.linha = r.linha; i++; proximo(); }, function() { bzConfirmar([n]); i++; proximo(); });
                    })();
                });
            });
        }

        // ---------- BAR / COZINHA: Novos | Em preparo | Prontos ----------
        function bzGrupos(ehCozinha) {
            var col = { pendente: [], preparando: [], pronto: [] }, mapa = {};
            todasMesas().forEach(function(m) {
                if (m.status !== 'ocupada') return;
                m.itens.forEach(function(it) {
                    var st = it.statusPreparo || 'pendente';
                    if (st === 'entregue' || itemEhCaixa(it) || itemEhCozinha(it) !== ehCozinha || !col[st]) return;
                    var pe = bzPedidoEm(it), k = st + '|' + String(m.id) + '|' + pe.substring(0, 16);
                    if (!mapa[k]) { mapa[k] = { m: m, st: st, pe: pe, rk: String(m.id) + '|' + pe, itens: [] }; col[st].push(mapa[k]); }
                    mapa[k].itens.push(it);
                });
            });
            col.pendente.sort(function(a, b) { return bzMs(a.pe) - bzMs(b.pe); });
            col.preparando.sort(function(a, b) { return bzMs(a.pe) - bzMs(b.pe); });
            col.pronto.sort(function(a, b) { return bzMs(b.pe) - bzMs(a.pe); });
            return col;
        }
        function bzMarcar(ids, st) { String(ids).split(',').forEach(function(id) { if (id !== '') mudarEstadoPorId(Number(id), st); }); }
        function bzCardKDS(g) {
            var min = bzMin(g.pe), cls = 'bz-card ' + g.st;
            if (g.st !== 'pronto') cls += min >= 20 ? ' atrasado' : min >= 10 ? ' atencao' : '';
            if (g.st === 'pendente' && BZ.recem[g.rk] && Date.now() - BZ.recem[g.rk] < 6000) cls += ' chegou';
            if (g.itens.some(function(i) { return i.teste; })) cls += ' teste';
            var ids = g.itens.map(function(i) { return i.idItem; }).join(',');
            var bts = g.st === 'pendente'
                ? '<div class="bz-card-a"><button type="button" class="prep" onclick="bzMarcar(\'' + ids + '\', \'preparando\')">Preparar</button><button type="button" class="ok" onclick="bzMarcar(\'' + ids + '\', \'pronto\')">Pronto ✓</button></div>'
                : g.st === 'preparando'
                    ? '<div class="bz-card-a um"><button type="button" class="ok" onclick="bzMarcar(\'' + ids + '\', \'pronto\')">Pronto ✓</button></div>'
                    : '<div class="bz-card-a"><button type="button" class="volta" onclick="bzMarcar(\'' + ids + '\', \'preparando\')">↩ Voltar</button><button type="button" class="ok" onclick="bzMarcar(\'' + ids + '\', \'entregue\')">Entregue ✓</button></div>';
            var h = soHora(g.pe).substring(0, 5);
            return '<div class="' + cls + '"><div class="bz-card-h"><span class="m">' + esc(nomeMesa(g.m)) + '</span>' +
                '<span class="t">' + (h || '') + (g.st !== 'pronto' && h ? ' · ' + (min < 1 ? 'agora' : 'há ' + min + ' min') : '') + '</span></div>' +
                '<div class="bz-card-i">' + g.itens.map(function(i) {
                    return '<div class="ci"><b>' + i.qnt + 'x</b>' + esc(i.produto) + (i.teste ? ' ' + etiquetaTeste() : '') + (i.obs ? '<span class="obs">⚠ ' + esc(i.obs) + '</span>' : '') + '</div>';
                }).join('') + '</div>' + bts + '</div>';
        }
        function bzHtmlKDS(ehCozinha) {
            var c = bzGrupos(ehCozinha);
            function coluna(st, titulo, vazio, classe) {
                return '<div class="bz-col ' + classe + '"><div class="bz-col-h">' + titulo + '<span class="n">' + c[st].length + '</span></div><div class="bz-col-b">' +
                    (c[st].length ? c[st].map(bzCardKDS).join('') : '<div class="bz-nada">' + vazio + '</div>') + '</div></div>';
            }
            return '<div class="bz-kds">' +
                coluna('pendente', 'Novos', 'Sem pedidos novos.', 'novo') +
                coluna('preparando', 'Em preparo', 'Nada em preparo.', 'prep') +
                coluna('pronto', 'Prontos', 'Itens prontos ficam aqui até serem entregues.', 'pronto') + '</div>';
        }

        // ---------- desenho principal (substitui o anterior) ----------
        function renderizarBase() {
            try {
                capturarValoresFormulario();
                var main = document.getElementById('app-conteudo');
                if (!main) return;
                bzCabecalho();
                bzAvisos();
                if (!BZ.tela) { main.innerHTML = bzHtmlInicio(); return; }
                if (BZ.tela !== 'caixa' && estado.abaAtiva !== BZ.tela) estado.abaAtiva = BZ.tela;
                var aba = estado.abaAtiva;
                var rolLado = document.getElementById('bz-lado'), rolCmd = document.getElementById('bz-cmd-lista');
                var sLado = rolLado ? rolLado.scrollTop : 0, sCmd = rolCmd ? rolCmd.scrollTop : 0;
                var rolCols = document.querySelectorAll('.bz-col-b'), sCols = [];
                for (var r = 0; r < rolCols.length; r++) sCols.push(rolCols[r].scrollTop);
                if (aba === 'caixa' || aba === 'abertas') main.innerHTML = bzHtmlCaixa(false);
                else if (aba === 'vip') main.innerHTML = bzHtmlCaixa(true);
                else if (aba === 'bar' || aba === 'cozinha') main.innerHTML = bzHtmlKDS(aba === 'cozinha');
                else { renderizarBaseAntigo(); }
                var l2 = document.getElementById('bz-lado'), c2 = document.getElementById('bz-cmd-lista');
                if (l2) l2.scrollTop = sLado; if (c2) c2.scrollTop = sCmd;
                var cols2 = document.querySelectorAll('.bz-col-b');
                for (var r2 = 0; r2 < cols2.length && r2 < sCols.length; r2++) cols2[r2].scrollTop = sCols[r2];
                main.className = (aba === 'finalizadas' || aba === 'logs') ? 'bz-rolavel' : 'bz-cheio';
            } catch (err) {
                console.log('Erro ao desenhar:', err);
            }
        }
        setInterval(function() { if (BZ.tela === 'bar' || BZ.tela === 'cozinha') renderizarSeLivre(); }, 30000); // atualiza o "há X min"
        (function relogioBz() {
            var r = document.getElementById('bz-relogio');
            if (r) { var d = new Date(); r.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
            setTimeout(relogioBz, 15000);
        })();
        if (BZ.tela && !ESTACAO) {
            (function() {
                var d = document.createElement('div');
                d.id = 'bz-comecar'; d.className = 'bz-comecar';
                d.innerHTML = '<button type="button" onclick="bzComecar()">Toque para começar<small>ativa o aviso sonoro de pedidos</small></button>';
                document.body.appendChild(d);
            })();
        }

        // Executa imediatamente e sincroniza em segundo plano
        if (ESTACAO) {
            if (!CHAVE) pedirChave('');
            iniciarEstacao();
        } else {
            renderizar();
            if (!CHAVE) pedirChave('');
            sincronizar();
            setInterval(function() { if (estado.sincT && Date.now() - estado.sincT < 6000) return; sincronizar(); }, 2000);   // não empilha consultas quando o servidor está lento
        }
    </script>
</body>
